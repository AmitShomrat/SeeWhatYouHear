name: CMake on multiple platforms

on:
  push:
    branches: [ "Action_work_flow" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            triplet: x64-windows
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            triplet: x64-linux

    steps:
    - uses: actions/checkout@v4

    # --- Ubuntu system deps (unchanged, includes Boost) ---
    - name: Install Ubuntu Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y \
          libasound2-dev libx11-dev libfreetype-dev libfontconfig-dev libgl-dev \
          libcurl4-openssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libboost-all-dev

    # --- Windows: set up vcpkg and install Boost ---
    - name: Set up vcpkg
      if: matrix.os == 'windows-latest'
      uses: lukka/run-vcpkg@v11
      with:
        # pin a recent commit for reproducibility (optional)
        vcpkgGitCommitId: 1f0f2b1b5c0a2d2e3f4a5b6c7d8e9f0011223344

    - name: Install Boost with vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install boost-asio:${{ matrix.triplet }} boost-system:${{ matrix.triplet }}
        # add others if you use them: boost-filesystem, boost-thread, etc.

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Use vcpkg toolchain on Windows so find_package(Boost CONFIG ...) works
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.os == 'windows-latest' && format('-DCMAKE_TOOLCHAIN_FILE={0}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET={1}', env.VCPKG_ROOT, matrix.triplet) || '' }}
        -S ${{ github.workspace }}

    - name: Build VST3
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target SeeWhatYouHear_VST3 --config ${{ matrix.build_type }}

    - name: Upload VST3 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SeeWhatYouHear-${{ matrix.os }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.build-output-dir }}/plugin/SeeWhatYouHear_artefacts/${{ matrix.build_type }}/VST3

    - name: Get Version
      id: version
      run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
